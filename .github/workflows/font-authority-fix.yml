# one-shot trigger
name: one-shot font authority migration

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/font-authority-fix.yml'

permissions:
  contents: write

jobs:
  migrate-font-authority:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Patch NOMY and BYPO font authority
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path
          import re

          p = Path('nomy.py')
          s = p.read_text(encoding='utf-8')
          old = '''CORPO_NOMY = 16
FONTES_NOMY_TXT = ROOT / "base" / "fontes_nomy.txt"
HELP_NOMY_MD = ROOT / "data" / "acros" / "help_nomy.md"


def _carregar_fontes_nomy() -> dict[str, str]:
    if not FONTES_NOMY_TXT.is_file():
        raise RuntimeError(f"NOMY: lista de fontes não encontrada: {FONTES_NOMY_TXT}")

    fontes: dict[str, str] = {}
    for linha in FONTES_NOMY_TXT.read_text(encoding="utf-8").splitlines():
        linha = linha.strip()
        if not linha or linha.startswith("#"):
            continue
        if "|" not in linha:
            continue

        nome, arquivo = (parte.strip() for parte in linha.split("|", 1))
        if nome and arquivo:
            fontes[nome] = arquivo

    if not fontes:
        raise RuntimeError(f"NOMY: nenhuma fonte válida em {FONTES_NOMY_TXT}")

    return fontes
'''
          new = '''CORPO_NOMY = 16
FONTES_DIR = ROOT / "fonts"
HELP_NOMY_MD = ROOT / "data" / "acros" / "help_nomy.md"


def _carregar_fontes_nomy() -> dict[str, str]:
    if not FONTES_DIR.is_dir():
        raise RuntimeError(f"NOMY: pasta de fontes não encontrada: {FONTES_DIR}")

    arquivos = sorted(
        (
            p for p in FONTES_DIR.iterdir()
            if p.is_file() and p.suffix.casefold() in {".ttf", ".otf"}
        ),
        key=lambda p: p.name.casefold(),
    )

    if not arquivos:
        raise RuntimeError(f"NOMY: nenhuma fonte encontrada em {FONTES_DIR}")

    return {p.stem: p.name for p in arquivos}
'''
          if old not in s:
              raise SystemExit('NOMY: bloco esperado não encontrado; abortando sem alterar.')
          p.write_text(s.replace(old, new, 1), encoding='utf-8')

          p = Path('bypo.py')
          s = p.read_text(encoding='utf-8')
          pattern = re.compile(
              r'def _load_fontes_ypoemas\(\):\n'
              r'.*?'
              r'(?=def _fontes_ypoemas_dict\(\):)',
              re.S,
          )
          replacement = '''def _load_fontes_ypoemas():
    """Lista de fontes = arquivos físicos .ttf/.otf existentes em /fonts."""
    fontes_dir = _project_path("fonts")
    fontes = []
    try:
        for filename in os.listdir(fontes_dir):
            caminho = os.path.join(fontes_dir, filename)
            if not os.path.isfile(caminho):
                continue
            stem, ext = os.path.splitext(filename)
            if ext.casefold() not in {".ttf", ".otf"}:
                continue
            label = stem.strip()
            if label:
                fontes.append((label, filename))
    except OSError:
        return []
    return sorted(fontes, key=lambda item: item[0].casefold())


'''
          s2, count = pattern.subn(replacement, s, count=1)
          if count != 1:
              raise SystemExit(f'BYPO: esperado 1 bloco _load_fontes_ypoemas; encontrados {count}.')
          p.write_text(s2, encoding='utf-8')
          PY

      - name: Static CAE
        shell: bash
        run: |
          python -m py_compile nomy.py bypo.py
          git diff --check
          git diff -- nomy.py bypo.py

      - name: Commit surgical migration
        shell: bash
        run: |
          if git diff --quiet -- nomy.py bypo.py; then
            echo 'No changes.'
            exit 0
          fi
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add nomy.py bypo.py
          git commit -m 'fix: derive NOMY and BYPO fonts from /fonts'
          git push origin HEAD:main
