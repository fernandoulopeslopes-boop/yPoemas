name: one-shot font authority migration

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/font-authority-fix.yml'

permissions:
  contents: write

jobs:
  migrate-font-authority:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Patch NOMY and BYPO font authority
        shell: bash
        run: |
          echo '' | base64 -d > /tmp/font_patch.py
          python /tmp/font_patch.py

      - name: Static CAE
        shell: bash
        run: |
          python -m py_compile nomy.py bypo.py
          git diff --check
          git diff -- nomy.py bypo.py

      - name: Commit surgical migration
        shell: bash
        run: |
          if git diff --quiet -- nomy.py bypo.py; then
            echo 'No changes.'
            exit 0
          fi
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add nomy.py bypo.py
          git commit -m 'fix: derive NOMY and BYPO fonts from /fonts'
          git push origin HEAD:main
